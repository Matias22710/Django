<h1>Kalkulačka</h1>
<form method="post">
    {% csrf_token %}
    <input type="number" name="a" required>
    <select name="operacia" required>
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>
    <input type="number" name="b" required>
    <button type="submit">Vypočítať</button>
</form>

{% if vysledok == "err" %}
    <p> nulou sa nedelí</p>
{% elif vysledok is not None %}
    <p>Výsledok: {{ vysledok }}</p>
{% endif %}
