
<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Moja vizitka</title>
</head>
<body>

    <h1>Moja vizitka</h1>

    <p>Meno: {{ meno }}</p>
    <p>Trieda: {{ trieda }}</p>
    <p>Vek: {{ vek }}</p>

    <h2>Plnoletosť</h2>

    {% if vek >= 18 %}
        <p>Som plnoletý.</p>
    {% else %}
        <p>Nie som plnoletý.</p>
    {% endif %}

    <h2>Obľúbené predmety</h2>

    <ol>
        {% for predmet in predmety %}
            <li>{{ predmet }}</li>
        {% endfor %}
    </ol>

</body>
</html>
